<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>편의점 GO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', 'Inter', sans-serif; touch-action: none; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        @keyframes float { 0%, 100% { transform: translate(-50%, 0px); } 50% { transform: translate(-50%, -6px); } }
        @keyframes bagShake { 0%, 100% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(-12deg) scale(1.04); } 75% { transform: rotate(12deg) scale(1.04); } }
        @keyframes popIn { 0% { transform: scale(0.88); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        @keyframes suneungScroll {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .suneung-marquee {
            display: flex;
            width: max-content;
            animation: suneungScroll 20s linear infinite;
        }

        .mon-bubble { position: absolute; left: 50%; top: -44px; transform: translate(-50%, 0); animation: float 1.6s ease-in-out infinite; pointer-events: auto; cursor: pointer; }
        .bag-shake { animation: bagShake 0.25s ease-in-out 1; }
        .pop-in { animation: popIn 0.18s cubic-bezier(0.16, 1, 0.3, 1); }

        #mapContainer {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="bg-slate-200 text-slate-800 h-screen w-screen overflow-hidden flex justify-center select-none">

    <!-- 모바일 프레임 컨테이너 -->
    <div class="relative w-full max-w-[460px] h-full bg-white shadow-2xl overflow-hidden flex flex-col border-x border-slate-200">

        <!-- 상단 응원 전광판 배너 -->
        <div class="relative z-[1150] bg-amber-300/95 text-slate-900 text-[11px] font-black py-1 border-b border-amber-400 overflow-hidden shrink-0">
            <div class="suneung-marquee">
                <span class="px-5">🎓 수능 파이팅!!! 수능 보신 분들 수고하셨습니다. · 지도를 쭉 드래그해 주변 편의점 35m 이내에서 편의몬을 잡아보세요!</span>
                <span class="px-5">🎓 수능 파이팅!!! 수능 보신 분들 수고하셨습니다. · 지도를 쭉 드래그해 주변 편의점 35m 이내에서 편의몬을 잡아보세요!</span>
            </div>
        </div>

        <!-- 2D 지도 캔버스 영역 -->
        <div id="mapContainer" class="absolute inset-0 z-0 bg-[#f4f6f8] overflow-hidden cursor-grab active:cursor-grabbing">
            <canvas id="vectorMapCanvas" class="block w-full h-full"></canvas>
            <div id="mapOverlayLayer" class="absolute inset-0 pointer-events-none"></div>
        </div>

        <!-- 상단 플로팅 바 -->
        <div class="absolute top-9 left-3 right-3 z-[1000] flex flex-col gap-2 pointer-events-none">
            <div class="flex items-center gap-2.5 bg-white/95 backdrop-blur-md p-2.5 rounded-2xl shadow-md pointer-events-auto border border-slate-200/80">
                <button onclick="openProfileModal()" id="userAvatarBtn" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-200 flex items-center justify-center text-xl shrink-0 transition active:scale-95" title="내 아이콘 변경">
                    🧑
                </button>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1.5">
                        <span id="userNameLabel" class="text-[11px] font-extrabold text-slate-700">편의점 헌터</span>
                        <span id="coordBadge" class="text-[9px] bg-blue-50 text-blue-600 border border-blue-200 px-1.5 py-0.5 rounded-md font-bold">GPS 탐색중</span>
                        <span id="discountHudBadge" class="hidden text-[9px] bg-violet-600 text-white px-1.5 py-0.5 rounded-md font-extrabold">🏷️ +30% 2:00</span>
                    </div>
                    <div id="currentLocationBadge" class="text-xs font-bold text-slate-500 truncate mt-0.5">주변 편의점 &amp; 편의몬 탐색 중...</div>
                </div>
                <button id="topRightClockBtn" onclick="cycleTimeOverride()" class="px-2.5 py-1.5 bg-amber-50 hover:bg-amber-100 text-slate-900 border border-amber-200 rounded-xl text-[11px] font-black shadow-xs transition active:scale-95 flex items-center gap-1 shrink-0" title="왼쪽 해/달 아이콘 · 오른쪽 현재 시각 (클릭 시 낮/밤 테스트 전환)">
                    <span id="clockSunMoonIcon" class="text-sm leading-none">☀️</span>
                    <span id="clockTimeText" class="tabular-nums">00:00</span>
                </button>
                <button onclick="locateUserGPS()" class="px-3 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold shadow-sm transition active:scale-95 flex items-center gap-1.5 shrink-0">
                    <i class="fa-solid fa-location-crosshairs"></i> 현위치
                </button>
            </div>

            <!-- 브랜드 필터 & 지도 스타일 전환 -->
            <div class="flex items-center gap-1.5 overflow-x-auto py-0.5 px-0.5 no-scrollbar pointer-events-auto">
                <button id="btn-ALL" onclick="filterBrand('ALL')" class="brand-btn px-3 py-1.5 rounded-xl text-xs font-bold transition-all bg-slate-900 text-white shadow-sm shrink-0">전체</button>
                <button id="btn-CU" onclick="filterBrand('CU')" class="brand-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-white text-purple-700 border border-slate-200 shadow-sm hover:bg-purple-50 shrink-0">CU</button>
                <button id="btn-GS25" onclick="filterBrand('GS25')" class="brand-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-white text-sky-700 border border-slate-200 shadow-sm hover:bg-sky-50 shrink-0">GS25</button>
                <button id="btn-7-ELEVEN" onclick="filterBrand('7-ELEVEN')" class="brand-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-white text-emerald-700 border border-slate-200 shadow-sm hover:bg-emerald-50 shrink-0">세븐일레븐</button>
                <button id="btn-EMART24" onclick="filterBrand('EMART24')" class="brand-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-white text-amber-700 border border-slate-200 shadow-sm hover:bg-amber-50 shrink-0">이마트24</button>
                <button id="btn-mapMode" onclick="cycleMapStyleMode()" class="px-2.5 py-1.5 rounded-xl text-xs font-extrabold transition-all bg-blue-50 text-blue-700 border border-blue-200 shadow-sm hover:bg-blue-100 shrink-0">🗺️ 2D지도</button>
            </div>
        </div>

        <!-- 좌측 줌 컨트롤 & 축척 -->
        <div id="leftControls" class="absolute left-3 bottom-[47vh] z-[900] flex flex-col gap-2 pointer-events-none transition-all duration-300">
            <div class="bg-white/95 backdrop-blur rounded-2xl shadow-md border border-slate-200 overflow-hidden flex flex-col pointer-events-auto">
                <button onclick="zoomMap(1)" class="w-9 h-9 flex items-center justify-center text-slate-700 hover:bg-slate-100 border-b border-slate-100 active:bg-slate-200"><i class="fa-solid fa-plus text-xs"></i></button>
                <button onclick="zoomMap(-1)" class="w-9 h-9 flex items-center justify-center text-slate-700 hover:bg-slate-100 active:bg-slate-200"><i class="fa-solid fa-minus text-xs"></i></button>
            </div>
            <div class="bg-white/90 backdrop-blur px-2 py-1 rounded-lg border border-slate-200 shadow-sm flex flex-col items-center">
                <span id="scaleLabel" class="text-[9px] font-bold text-slate-600">200m</span>
                <div id="scaleBar" class="h-1 border-x-2 border-b-2 border-slate-700 w-10 mt-0.5"></div>
            </div>
        </div>

        <!-- 우측 게임 액션 메뉴 -->
        <div id="rightControls" class="absolute right-3 bottom-[47vh] z-[900] flex flex-col items-end gap-2 transition-all duration-300">
            <div class="flex items-center gap-1.5 bg-white/95 backdrop-blur border border-slate-200 px-2.5 py-1.5 rounded-xl shadow-md">
                <span class="text-xs font-extrabold text-amber-500" id="goldPill">💰 500G</span>
                <span class="text-slate-300">|</span>
                <span class="text-xs font-extrabold text-blue-600" id="bagPill">🛍️ 10개</span>
            </div>

            <button onclick="openRadar()" class="w-11 h-11 bg-white hover:bg-slate-50 rounded-2xl shadow-md border border-slate-200 text-lg flex items-center justify-center active:scale-95 transition relative" title="친구 레이더 &amp; 친구추가">
                📡<span id="friendBadge" class="absolute -top-1 -right-1 w-3 h-3 bg-rose-500 rounded-full border-2 border-white hidden"></span>
            </button>
            <button onclick="openBagShop()" class="w-11 h-11 bg-white hover:bg-slate-50 rounded-2xl shadow-md border border-slate-200 text-lg flex items-center justify-center active:scale-95 transition" title="비닐봉투 상점">
                🛍️
            </button>
            <button onclick="openDex()" class="w-11 h-11 bg-white hover:bg-slate-50 rounded-2xl shadow-md border border-slate-200 text-lg flex items-center justify-center active:scale-95 transition relative" title="편의몬 도감">
                📖<span id="dexBadge" class="absolute -top-1.5 -right-1.5 bg-slate-900 text-white text-[10px] font-extrabold rounded-full px-1.5 py-0.5">0</span>
            </button>
            <button onclick="openSuneungEventModal()" class="w-11 h-11 bg-amber-300 hover:bg-amber-400 rounded-2xl shadow-md border border-amber-400 text-lg flex items-center justify-center active:scale-95 transition" title="수능 응원 이벤트">
                🎓
            </button>
            <button onclick="openShopModal()" class="w-11 h-11 bg-amber-50 hover:bg-amber-100 rounded-2xl shadow-md border border-amber-200 text-lg flex items-center justify-center active:scale-95 transition" title="1+1 · 뜨거운 물 · 30% 할인 상점">
                ♨️
            </button>
            <button onclick="openOwnerTutorial(0)" class="w-11 h-11 bg-indigo-50 hover:bg-indigo-100 rounded-2xl shadow-md border border-indigo-200 text-lg flex items-center justify-center active:scale-95 transition" title="편의점 사장님 튜토리얼">
                🧑‍💼
            </button>
            <button onclick="centerOnUser()" class="w-11 h-11 bg-blue-600 hover:bg-blue-700 rounded-2xl shadow-md text-white flex items-center justify-center text-base active:scale-95 transition" title="내 위치로 이동">
                <i class="fa-solid fa-location-arrow"></i>
            </button>
        </div>

        <!-- 길찾기 안내 패널 -->
        <div id="routePanel" class="absolute top-32 left-3 right-3 z-[1100] bg-white/95 backdrop-blur-md text-slate-800 p-3.5 rounded-2xl shadow-xl border border-blue-200 hidden transition-all">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white text-xs shadow-sm">
                        <i class="fa-solid fa-person-walking"></i>
                    </div>
                    <div>
                        <div class="text-[10px] text-blue-600 font-extrabold uppercase">도보 최단 경로 안내</div>
                        <div id="routeTargetName" class="text-xs font-extrabold text-slate-900 truncate max-w-[230px]">목적지 편의점</div>
                    </div>
                </div>
                <button onclick="clearRoute()" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>
            <div class="bg-slate-50 border border-slate-100 p-2.5 rounded-xl flex items-center justify-between">
                <div>
                    <div id="routeTime" class="text-sm font-black text-blue-600">약 4분</div>
                    <div id="routeDistance" class="text-[11px] font-semibold text-slate-500">거리 280m</div>
                </div>
                <div id="routeSteps" class="text-right text-[11px] font-bold text-slate-700 max-w-[190px]">
                    큰길을 따라 직진 후 우회전
                </div>
            </div>
        </div>

        <!-- 하단 바텀시트 -->
        <div id="sidebar" class="absolute bottom-0 left-0 right-0 z-[1000] bg-white rounded-t-[28px] shadow-[0_-8px_25px_rgba(15,23,42,0.08)] border-t border-slate-200/80 flex flex-col transition-all duration-300" style="height: 44vh;">
            <div onclick="toggleMobileDrawer()" class="w-full pt-2.5 pb-2 flex flex-col items-center justify-center cursor-pointer">
                <div class="w-10 h-1 bg-slate-300 rounded-full mb-2"></div>
                <div class="flex items-center justify-between w-full px-5">
                    <div class="flex items-center gap-2">
                        <h2 class="font-extrabold text-sm text-slate-900">주변 편의점 &amp; 출몰 편의몬</h2>
                        <span id="storeCount" class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded-full text-xs font-extrabold">0</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="event.stopPropagation(); minimizeDrawer();" class="px-2 py-0.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-[10px] font-extrabold text-slate-600 transition">
                            지도넓게
                        </button>
                        <span id="drawerToggleBtn" class="text-xs font-bold text-blue-600 flex items-center gap-1">
                            <i class="fa-solid fa-chevron-up"></i> 크게보기
                        </span>
                    </div>
                </div>
            </div>

            <div class="px-4 pb-2.5 flex items-center gap-2 border-b border-slate-100">
                <div class="relative flex-1 flex items-center">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 text-xs text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="handleSearchInput()" onkeydown="if(event.key==='Enter') searchNewLocation()" placeholder="지점명·동네(예: 강남역, 천안, 명동) 검색" class="w-full bg-slate-100 pl-8 pr-14 py-2 rounded-xl text-xs font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                    <button onclick="searchNewLocation()" class="absolute right-1.5 px-2 py-1 bg-blue-600 text-white rounded-lg text-[10px] font-bold hover:bg-blue-700 transition">이동</button>
                </div>
                <select id="radiusSelect" onchange="updateRadius()" class="bg-slate-100 px-2.5 py-2 rounded-xl text-xs font-bold text-slate-700 focus:outline-none">
                    <option value="100">100m</option>
                    <option value="200" selected>200m</option>
                    <option value="500">500m</option>
                    <option value="1500">1.5km</option>
                    <option value="5000">5km</option>
                </select>
            </div>

            <div id="storeList" class="flex-1 overflow-y-auto p-3.5 space-y-2.5 bg-slate-50/50"></div>
        </div>

        <!-- 모달 & 토스트 -->
        <div id="gameModal" class="absolute inset-0 z-[3000] bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4"></div>
        <div id="toast" class="absolute top-32 left-1/2 -translate-x-1/2 z-[3500] bg-slate-900 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 flex items-center gap-2 whitespace-nowrap">
            <span id="toastMsg">메시지</span>
        </div>
    </div>

    <script>
        /* ===== 1. 기본 설정 및 상태 관리 ===== */
        const BRAND_CONFIG = {
            'CU': { name: 'CU', short: 'CU', color: '#7c3aed', badge: 'bg-purple-50 text-purple-700 border-purple-200' },
            'GS25': { name: 'GS25', short: 'GS', color: '#0284c7', badge: 'bg-sky-50 text-sky-700 border-sky-200' },
            '7-ELEVEN': { name: '세븐일레븐', short: '7E', color: '#059669', badge: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
            'EMART24': { name: '이마트24', short: 'E24', color: '#d97706', badge: 'bg-amber-50 text-amber-700 border-amber-200' }
        };

        const CATCH_RANGE = 35;
        let STORES_DATA = [];
        let userLocation = { lat: 36.8151, lng: 127.1139 };
        let mapCenter = { lat: 36.8151, lng: 127.1139 };
        let mapZoom = 14.5;
        let selectedBrand = 'ALL';
        let currentRadius = 200;
        let activeDestination = null;
        // drawerState: 'minimized' | 'normal' | 'expanded'
        let drawerState = 'normal';
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let cheatModeActive = false;
        let mapStyleMode = '2d';
        let timeOverrideSlot = null;

        // 부드러운 관성 이동 및 멀티터치 핀치 줌 상태
        let mapVelocity = { lat: 0, lng: 0 };
        let inertiaFrameId = null;
        let activePointers = new Map();
        let lastPinchDist = null;
        let lastMoveTime = 0;

        const DAY_ONLY_MON_IDS = ['mon_76', 'mon_77', 'mon_78', 'mon_79', 'mon_80', 'mon_101', 'mon_102', 'mon_103'];
        const NIGHT_ONLY_MON_IDS = ['mon_51', 'mon_52', 'mon_53', 'mon_130', 'mon_131', 'mon_135', 'mon_136', 'mon_139'];
        const HOURLY_LIMITED_MON_IDS = ['mon_126', 'mon_127', 'mon_128', 'mon_129', 'mon_133', 'mon_134', 'mon_144', 'mon_145'];

        function getCurrentTimeInfo() {
            const now = new Date();
            const hour = now.getHours();
            const minute = now.getMinutes();
            let mode = timeOverrideSlot;
            if (!mode) {
                if (hour >= 6 && hour < 18) mode = 'day';
                else mode = 'night';
            }
            const hourlyIndex = now.getHours();
            const hourlyMon = MONSTERS.find(m => m.id === HOURLY_LIMITED_MON_IDS[hourlyIndex % HOURLY_LIMITED_MON_IDS.length]) || MONSTERS[125];
            return {
                hour,
                minute,
                clockText: `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`,
                sunMoon: mode === 'day' ? '☀️' : '🌙',
                mode,
                hourlyIndex,
                hourlyMon,
                label: mode === 'day' ? `☀️ 낮 (${hour}시)` : `🌙 밤 (${hour}시)`
            };
        }

        function getMonsterTimeTag(monId) {
            if (DAY_ONLY_MON_IDS.includes(monId)) return { text: '☀️ 낮전용', cls: 'bg-sky-100 text-sky-800 border-sky-200' };
            if (NIGHT_ONLY_MON_IDS.includes(monId)) return { text: '🌙 밤전용', cls: 'bg-indigo-900 text-indigo-100 border-indigo-700' };
            if (HOURLY_LIMITED_MON_IDS.includes(monId)) return { text: '⏰ 시간한정', cls: 'bg-amber-100 text-amber-900 border-amber-300' };
            return null;
        }

        function cycleTimeOverride() {
            const order = [null, 'day', 'night'];
            const next = order[(order.indexOf(timeOverrideSlot) + 1) % order.length];
            timeOverrideSlot = next;
            spawns = {};
            updateTopUI();
            redrawMap();
            const info = getCurrentTimeInfo();
            showToast(next === null
                ? `🕒 실제 시각 모드로 복귀 (${info.label})`
                : `🧪 시간대 테스트 전환: ${info.label} · ⏰ ${info.hourlyMon.name} 출현!`);
        }

        let userProfile = {
            name: '',
            hasSetNickname: false,
            hasSeenTutorial: false,
            claimedSuneungCheer: false,
            emoji: '🧑',
            gold: 500,
            bags: { normal: 10, eco: 3, premium: 1 },
            hasTarpaulin: false,
            items: { onePlusOne: 1, hotWater: 1, discount30: 1 },
            equipped: { slot1: null, slot2: null, slot3: 'discount30' },
            hotWaterStartedAt: null,
            discount30EndsAt: null
        };

        let friendsList = [
            { id: 'f1', name: '야식헌터_민수', emoji: '😎', dist: '120m', mon: '참치마요몽', status: 'friend' },
            { id: 'f2', name: '편의점마스터', emoji: '🐱', dist: '240m', mon: '바나나단지냥', status: 'friend' }
        ];
        let pendingRequests = [
            { id: 'f3', name: '새벽알바생', emoji: '🧢', dist: '380m', mon: '매콤불닭용', status: 'pending' }
        ];

        let dex = {};
        let spawns = {};
        let enc = null;
        let currentModalType = null;

        function safeShowToast(msg) {
            try {
                showToast(msg);
            } catch (e) {}
        }

        window.addEventListener('error', () => {
            safeShowToast('일시적인 오류가 발생했지만 화면을 복구했습니다.');
        });

        window.addEventListener('unhandledrejection', () => {
            safeShowToast('비동기 작업 중 오류가 발생했습니다.');
        });

        /* ===== 2. 150종 고유 편의몬 데이터 & 고품질 벡터 아바타 ===== */
        const MONSTER_ARCHETYPES = [
            {
                type: 'onigiri',
                names: [

        function loadGameData() {
            try {
                const savedProfile = JSON.parse(localStorage.getItem('pyeoni_profile_v5'));
                if (savedProfile) {
                    userProfile = {
                        ...userProfile,
                        ...savedProfile,
                        bags: { ...userProfile.bags, ...(savedProfile.bags || {}) },
                        items: { ...userProfile.items, ...(savedProfile.items || {}) },
                        equipped: { ...userProfile.equipped, ...(savedProfile.equipped || {}) }
                    };
                    if (typeof savedProfile.hasSetNickname !== 'boolean') {
                        userProfile.hasSetNickname = Boolean(savedProfile.name && savedProfile.name.trim());
                    }
                }
                const savedDex = JSON.parse(localStorage.getItem('pyeoni_dex_v5'));
                if (savedDex) dex = savedDex;
                const savedFriends = JSON.parse(localStorage.getItem('pyeoni_friends_v5'));
                if (savedFriends) friendsList = savedFriends;
                const savedPending = JSON.parse(localStorage.getItem('pyeoni_pending_v5'));
                if (savedPending) pendingRequests = savedPending;
            } catch (e) {}

            if (Object.keys(dex).length === 0) {
                dex['mon_1'] = { count: 1, level: 5, nickname: '', aura: '#fef08a', color: MONSTERS[0].color };
                saveGameData();
            }
            updateTopUI();
        }

        function saveGameData() {
            try {
                localStorage.setItem('pyeoni_profile_v5', JSON.stringify(userProfile));
                localStorage.setItem('pyeoni_dex_v5', JSON.stringify(dex));
                localStorage.setItem('pyeoni_friends_v5', JSON.stringify(friendsList));
                localStorage.setItem('pyeoni_pending_v5', JSON.stringify(pendingRequests));
            } catch (e) {
                safeShowToast('저장 공간 제한으로 일부 데이터가 메모리에만 유지됩니다.');
            }
            updateTopUI();
            updateFriendBadge();
        }

        function updateTopUI() {
            document.getElementById('userAvatarBtn').textContent = userProfile.emoji;
            document.getElementById('userNameLabel').textContent = userProfile.hasSetNickname && userProfile.name ? userProfile.name : '닉네임 미설정';
            document.getElementById('goldPill').textContent = `💰 ${userProfile.gold.toLocaleString()}G`;
            const totalBags = (userProfile.bags.normal || 0) + (userProfile.bags.eco || 0) + (userProfile.bags.premium || 0);
            document.getElementById('bagPill').textContent = userProfile.hasTarpaulin ? `🛍️ ${totalBags}개 + 🧳∞` : `🛍️ ${totalBags}개`;
            document.getElementById('dexBadge').textContent = Object.keys(dex).length;

            const timeInfo = getCurrentTimeInfo();
            const sunMoonEl = document.getElementById('clockSunMoonIcon');
            const clockTimeEl = document.getElementById('clockTimeText');
            const clockBtnEl = document.getElementById('topRightClockBtn');
            if (sunMoonEl) sunMoonEl.textContent = timeInfo.sunMoon;
            if (clockTimeEl) clockTimeEl.textContent = timeInfo.clockText;
            if (clockBtnEl) {
                clockBtnEl.className = timeInfo.mode === 'day'
                    ? 'px-2.5 py-1.5 bg-amber-50 hover:bg-amber-100 text-slate-900 border border-amber-200 rounded-xl text-[11px] font-black shadow-xs transition active:scale-95 flex items-center gap-1 shrink-0'
                    : 'px-2.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-amber-200 border border-slate-700 rounded-xl text-[11px] font-black shadow-xs transition active:scale-95 flex items-center gap-1 shrink-0';
            }

            const discBadge = document.getElementById('discountHudBadge');
            if (discBadge) {
                const remSec = getDiscount30RemainingSec();
                if (remSec > 0) {
                    discBadge.textContent = `🏷️ +30% ${formatRemainingSec(remSec)}`;
                    discBadge.classList.remove('hidden');
                } else {
                    discBadge.classList.add('hidden');
                }
            }
            updateFriendBadge();
        }

        function updateFriendBadge() {
            const badge = document.getElementById('friendBadge');
            if (!badge) return;
            if (pendingRequests.length > 0) {
                badge.classList.remove('hidden');

                badge.classList.add('hidden');
            }

        const LOCAL_SUFFIXES = ['역전점', '중앙점', '사거리점', '파크점', '대로점', '광장점', '타운점', '로데오점', '힐스점', '스퀘어점', '본점', '리버점'];

        const EXTRA_HUBS = [

            { region: '천안 서북구', spots: ['두정역남부', '성정공원', '백석대학로', '불당신도시', '차암동', '직산역'], lat: 36.8336, lng: 127.1378 },

            { region: '서울 성동구', spots: ['성수카페거리', '뚝섬역', '왕십리역', '금호사거리', '옥수역', '행당역'], lat: 37.5634, lng: 127.0368 },

        ];

        function getClosestRegionInfo(lat, lng) {
            let best = REAL_SPOTS[0];
            let minDist = Infinity;
            const allRegions = [...REAL_SPOTS, ...EXTRA_HUBS];
            allRegions.forEach(r => {
                const d = Math.hypot(r.lat - lat, r.lng - lng);
                if (d < minDist) { minDist = d; best = r; }
            });
            if (minDist > 0.18) {
                return {
                    region: '내 주변 생활권',
                    spots: ['역전사거리', '중앙대로', '시청광장', '문화공원', '대학로', '행복마을', '푸른숲길', '행복타운', '평화광장', '새싹거리']
                };
            }
            return best;
        }

        function getRealisticRoadNetwork(lat, lng) {
            const reg = getClosestRegionInfo(lat, lng);
            const primarySpots = reg.spots || ['중앙대로', '역전사거리', '문화공원', '대학로'];
            const short0 = (primarySpots[0] || '중앙').replace(/(역|사거리|대로|거리|광장|터미널|해변|시장)$/g, '') || '중앙';
            const short1 = (primarySpots[1] || '역전').replace(/(역|사거리|대로|거리|광장|터미널|해변|시장)$/g, '') || '역전';

            const short3 = (primarySpots[3] || '대학').replace(/(역|사거리|대로|거리|광장|터미널|해변|시장)$/g, '') || '대학';

            return {

                    { kind: 'civic', icon: '🏛️', label: `${short2}행정센터`, dx: 1.38, dy: -0.35, tint: '#f1f5f9', fg: '#475569' }

        function generateRealisticStores(baseLat, baseLng) {
            const safeLat = Number.isFinite(baseLat) ? baseLat : 36.8151;
            const safeLng = Number.isFinite(baseLng) ? baseLng : 127.1139;
            const brands = ['CU', 'GS25', '7-ELEVEN', 'EMART24'];
            const regionInfo = getClosestRegionInfo(safeLat, safeLng);
            const list = [];
            let id = 1;

            [...REAL_SPOTS, ...EXTRA_HUBS].forEach((reg, rIdx) => {
                reg.spots.forEach((spotName, sIdx) => {
                    const b = brands[(rIdx * 3 + sIdx) % brands.length];
                    const angle = (sIdx / Math.max(1, reg.spots.length)) * Math.PI * 2;
                    const radiusDeg = 0.0009 + (sIdx % 3) * 0.0008;
                    const offsetLat = Math.sin(angle) * radiusDeg;
                    const offsetLng = Math.cos(angle) * radiusDeg * 1.15;
                    list.push({
                        id: id++,
                        brand: b,
                        name: `${b} ${spotName}점`,
                        address: `${reg.region} ${spotName} 중심가 ${(sIdx + 1) * 12}길`,
                        lat: reg.lat + offsetLat,
                        lng: reg.lng + offsetLng
                    });
                });
            });

            for (let gx = -5; gx <= 5; gx++) {
                for (let gy = -5; gy <= 5; gy++) {
                    const seed = Math.abs(gx * 17 + gy * 31 + Math.round((safeLat + safeLng) * 1000));
                    const jitterLat = ((seed % 7) - 3) * 0.00022;
                    const jitterLng = (((seed * 3) % 7) - 3) * 0.00022;

                    const lat = safeLat + (gy * 0.0016) + jitterLat;
                    const lng = safeLng + (gx * 0.0019) + jitterLng;
                    const brand = brands[seed % brands.length];
                    const spot = regionInfo.spots[seed % regionInfo.spots.length];
                    const suffix = LOCAL_SUFFIXES[(Math.abs(gx) + Math.abs(gy) + seed) % LOCAL_SUFFIXES.length];

                    list.push({
                        id: id++,
                        brand,
                        name: `${brand} ${spot} ${suffix}`,
                        address: `${regionInfo.region} ${spot}로 ${(Math.abs(gx) + 1) * 10 + Math.abs(gy) * 3}`,
                        lat,
                        lng
                    });
                }
            }
            STORES_DATA = list;
        }

        function getStoreMonster(storeId) {
            const timeInfo = getCurrentTimeInfo();
            const spawnBucket = `${timeInfo.mode}_${timeInfo.hourlyIndex}_${Math.floor(Date.now() / 60000)}`;
            if (!spawns[storeId] || spawns[storeId].bucket !== spawnBucket) {
                let candidatePool = MONSTERS.filter(m => {
                    if (timeInfo.mode === 'day') return !NIGHT_ONLY_MON_IDS.includes(m.id);
                    return !DAY_ONLY_MON_IDS.includes(m.id);
                });
                if (candidatePool.length === 0) candidatePool = MONSTERS;

                if (storeId % 3 === 0) {
                    spawns[storeId] = { bucket: spawnBucket, monId: timeInfo.hourlyMon.id };
                } else {
                    const idx = (storeId * 11 + timeInfo.hourlyIndex * 7 + Math.floor(Date.now() / 60000)) % candidatePool.length;
                    spawns[storeId] = { bucket: spawnBucket, monId: candidatePool[idx].id };
                }
            }
            return MONSTERS.find(m => m.id === spawns[storeId].monId) || MONSTERS[0];
        }

        function stopMapInertia() {
            if (inertiaFrameId) {
                cancelAnimationFrame(inertiaFrameId);
                inertiaFrameId = null;
            }
            mapVelocity = { lat: 0, lng: 0 };
        }

        function startMapInertia() {
            stopMapInertia();
            const friction = 0.91;
            const step = () => {
                if (Math.abs(mapVelocity.lat) < 1e-7 && Math.abs(mapVelocity.lng) < 1e-7) {
                    inertiaFrameId = null;
                    return;
                }
                mapCenter.lat += mapVelocity.lat;
                mapCenter.lng += mapVelocity.lng;
                mapVelocity.lat *= friction;
                mapVelocity.lng *= friction;
                redrawMap();
                inertiaFrameId = requestAnimationFrame(step);
            };
            inertiaFrameId = requestAnimationFrame(step);
        }

        function initMapCanvas() {
            const container = document.getElementById('mapContainer');
            const canvas = document.getElementById('vectorMapCanvas');
            if (!container || !canvas) return;

            function resize() {
                const w = container.clientWidth;
                const h = container.clientHeight;
                const dpr = window.devicePixelRatio || 1;
                canvas.width = Math.max(1, Math.floor(w * dpr));
                canvas.height = Math.max(1, Math.floor(h * dpr));
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                const ctx = canvas.getContext('2d');
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                redrawMap();
            }

            if (typeof ResizeObserver !== 'undefined') {
                const ro = new ResizeObserver(() => resize());
                ro.observe(container);
            }

            container.addEventListener('pointerdown', e => {
                if (e.target.closest('button') || e.target.closest('.mon-bubble')) return;
                stopMapInertia();
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activePointers.size === 1) {
                    isDragging = true;
                    dragStart = { x: e.clientX, y: e.clientY };
                    lastPinchDist = null;
                    lastMoveTime = performance.now();
                    try {
                        container.setPointerCapture(e.pointerId);
                    } catch (_) {}
                } else if (activePointers.size === 2) {
                    isDragging = false;
                    const pts = Array.from(activePointers.values());
                    lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                }
            });

            container.addEventListener('pointermove', e => {
                if (!activePointers.has(e.pointerId)) return;
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    if (lastPinchDist && dist > 0) {
                        const zoomDelta = (dist - lastPinchDist) * 0.014;
                        mapZoom = Math.min(18, Math.max(12, mapZoom + zoomDelta));
                        redrawMap();
                    }
                    lastPinchDist = dist;
                    return;
                }

                if (!isDragging) return;
                const now = performance.now();
                const dt = Math.max(8, now - lastMoveTime);
                lastMoveTime = now;

                const dx = e.clientX - dragStart.x;
                const dy = e.clientY - dragStart.y;
                dragStart = { x: e.clientX, y: e.clientY };

                const scale = Math.pow(2, mapZoom) * 256;
                const degPerPxLng = 360 / scale;
                const degPerPxLat = (360 / scale) * Math.cos(mapCenter.lat * Math.PI / 180);

                const dLng = -dx * degPerPxLng;
                const dLat = dy * degPerPxLat;

                mapCenter.lng += dLng;
                mapCenter.lat += dLat;

                // 프레임 간격 보정된 부드러운 관성 속도
                const frameFactor = Math.min(1.6, 16 / dt);
                mapVelocity = {
                    lat: dLat * 0.78 * frameFactor,
                    lng: dLng * 0.78 * frameFactor
                };

                redrawMap();
            });

            const handlePointerEnd = e => {
                if (activePointers.has(e.pointerId)) {
                    activePointers.delete(e.pointerId);
                    try {
                        container.releasePointerCapture(e.pointerId);
                    } catch (_) {}
                }
                if (activePointers.size < 2) {
                    lastPinchDist = null;
                }
                if (isDragging && activePointers.size === 0) {
                    isDragging = false;
                    startMapInertia();
                }
            };

            container.addEventListener('pointerup', handlePointerEnd);
            container.addEventListener('pointercancel', handlePointerEnd);
            window.addEventListener('pointerup', handlePointerEnd);
            window.addEventListener('pointercancel', handlePointerEnd);

            container.addEventListener('wheel', e => {
                e.preventDefault();
                stopMapInertia();
                zoomMap(e.deltaY < 0 ? 0.5 : -0.5);
            }, { passive: false });

            resize();
        }

        function formatRemainingSec(sec) {

        function getHotWaterMultiplier(mon) {

            if (!userProfile.hotWaterStartedAt) return 1;
            const elapsedMs = Date.now() - userProfile.hotWaterStartedAt;
            const fiveMin = 5 * 60 * 1000;
            const tenMin = 10 * 60 * 1000;
            if (elapsedMs < 0 || elapsedMs >= tenMin) {
                userProfile.hotWaterStartedAt = null;
                return 1;
            }
            return elapsedMs < fiveMin ? 1.35 : 0.75;
        }

        function cycleMapStyleMode() {
            const modes = ['2d', 'soft', 'night'];
            const labels = {
                '2d': '🗺️ 2D지도',
                'soft': '🌿 파스텔지도',
                'night': '🌙 야간지도'
            };
            const next = modes[(modes.indexOf(mapStyleMode) + 1) % modes.length];
            mapStyleMode = next;
            const btn = document.getElementById('btn-mapMode');
            if (btn) btn.textContent = labels[mapStyleMode];
            redrawMap();
            showToast(`지도 스타일이 '${labels[mapStyleMode]}'(으)로 변경되었습니다.`);
        }

        function latLonToPixel(lat, lon, width, height) {
            const scale = Math.pow(2, mapZoom) * 256;
            const cx = (mapCenter.lng + 180) / 360 * scale;
            const sinC = Math.sin(mapCenter.lat * Math.PI / 180);
            const cy = (0.5 - Math.log((1 + sinC) / (1 - sinC)) / (4 * Math.PI)) * scale;

            const tx = (lon + 180) / 360 * scale;
            const sinT = Math.sin(lat * Math.PI / 180);
            const ty = (0.5 - Math.log((1 + sinT) / (1 - sinT)) / (4 * Math.PI)) * scale;

            return { x: width / 2 + (tx - cx), y: height / 2 + (ty - cy) };
        }

        function redrawMap() {
            try {
                const metersPerPx = 156543.03 * Math.cos(mapCenter.lat * Math.PI / 180) / Math.pow(2, mapZoom);
                const dist = Math.round((metersPerPx * 45) / 10) * 10 || 50;
                const scaleEl = document.getElementById('scaleLabel');
                if (scaleEl) scaleEl.textContent = dist >= 1000 ? `${(dist / 1000).toFixed(1)}km` : `${dist}m`;
                const container = document.getElementById('mapContainer');
                const canvas = document.getElementById('vectorMapCanvas');
                if (!container || !canvas) return;

                const w = container.clientWidth;
                const h = container.clientHeight;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const roadNet = getRealisticRoadNetwork(mapCenter.lat, mapCenter.lng);
                const isNight = mapStyleMode === 'night';
                const isSoft = mapStyleMode === 'soft';

                const bgGrad = ctx.createLinearGradient(0, 0, w, h);
                if (isNight) {
                    bgGrad.addColorStop(0, '#0f172a');
                    bgGrad.addColorStop(1, '#1e293b');
                } else if (isSoft) {
                    bgGrad.addColorStop(0, '#f3f7f2');
                    bgGrad.addColorStop(1, '#e8f0e8');
                } else {
                    bgGrad.addColorStop(0, '#f7f6f2');
                    bgGrad.addColorStop(1, '#f1efe9');
                }
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);

                const gridStepLat = 0.0032;
                const gridStepLng = 0.0036;
                const baseLat = Math.floor(mapCenter.lat / gridStepLat) * gridStepLat;
                const baseLng = Math.floor(mapCenter.lng / gridStepLng) * gridStepLng;

                for (let gx = -4; gx <= 4; gx++) {
                    for (let gy = -4; gy <= 4; gy++) {
                        const bLatTop = baseLat + (gy + 1) * gridStepLat;
                        const bLatBot = baseLat + gy * gridStepLat;
                        const bLngLeft = baseLng + gx * gridStepLng;
                        const bLngRight = baseLng + (gx + 1) * gridStepLng;

                        const pTL = latLonToPixel(bLatTop, bLngLeft, w, h);
                        const pBR = latLonToPixel(bLatBot, bLngRight, w, h);
                        const bw = pBR.x - pTL.x;
                        const bh = pBR.y - pTL.y;

                        const blockHash = Math.abs(gx * 37 + gy * 19);
                        const insetX = 7 + (blockHash % 5);
                        const insetY = 7 + ((blockHash * 3) % 5);

                        if (blockHash % 7 === 0) {
                            ctx.fillStyle = isNight ? '#14532d' : '#d7f0d6';
                            ctx.beginPath();
                            ctx.moveTo(pTL.x + insetX + 10, pTL.y + insetY);
                            ctx.quadraticCurveTo(pTL.x + bw * 0.55, pTL.y + insetY - 4, pBR.x - insetX - 6, pTL.y + bh * 0.35);
                            ctx.quadraticCurveTo(pBR.x - insetX + 4, pBR.y - insetY - 6, pTL.x + bw * 0.35, pBR.y - insetY);
                            ctx.quadraticCurveTo(pTL.x + insetX - 4, pBR.y - insetY - 10, pTL.x + insetX + 10, pTL.y + insetY);
                            ctx.fill();
                        } else if (blockHash % 10 === 0) {
                            ctx.strokeStyle = isNight ? '#1e3a8a' : '#cde5fa';
                            ctx.lineWidth = Math.max(12, bw * 0.16);
                            ctx.lineCap = 'round';
                            ctx.beginPath();
                            ctx.moveTo(pTL.x, pTL.y + bh * 0.15);
                            ctx.bezierCurveTo(pTL.x + bw * 0.35, pTL.y + bh * 0.65, pTL.x + bw * 0.72, pTL.y + bh * 0.25, pBR.x, pBR.y - bh * 0.1);
                            ctx.stroke();
                        } else {
                            ctx.fillStyle = isNight
                                ? (blockHash % 3 === 0 ? '#1e293b' : '#263349')
                                : (blockHash % 3 === 0 ? '#eeeae2' : '#ffffff');
                            ctx.beginPath();
                            ctx.roundRect(pTL.x + insetX, pTL.y + insetY, Math.max(0, bw - insetX * 2), Math.max(0, bh - insetY * 2), 12);
                            ctx.fill();

                            ctx.strokeStyle = isNight ? '#334155' : '#e5e7eb';
                            ctx.lineWidth = 2.2;
                            ctx.beginPath();
                            ctx.moveTo(pTL.x + insetX + 8, pTL.y + bh * 0.32);
                            ctx.bezierCurveTo(pTL.x + bw * 0.35, pTL.y + bh * 0.18, pTL.x + bw * 0.68, pTL.y + bh * 0.82, pBR.x - insetX - 8, pTL.y + bh * 0.62);
                            ctx.stroke();

                            ctx.fillStyle = isNight ? '#334155' : '#e7e5e4';
                            const subW = Math.max(11, (bw - insetX * 2) * 0.23);
                            const subH = Math.max(9, (bh - insetY * 2) * 0.19);
                            ctx.beginPath();
                            ctx.roundRect(pTL.x + insetX + 9, pTL.y + insetY + 9, subW, subH, 4);
                            ctx.roundRect(pBR.x - insetX - subW - 9, pBR.y - insetY - subH - 9, subW, subH, 4);
                            ctx.fill();
                        }
                    }
                }

                ctx.lineCap = 'round';
                const roadScale = Math.max(0.75, (mapZoom - 12) * 0.34);

                for (let i = -4; i <= 4; i++) {
                    const vSpec = roadNet.vRoads[Math.abs(i) % roadNet.vRoads.length];
                    const isMajorV = i === 0 || (vSpec && vSpec.major && Math.abs(i) % 2 === 0);
                    const pStartV = latLonToPixel(baseLat - 4.5 * gridStepLat, baseLng + i * gridStepLng, w, h);
                    const pEndV = latLonToPixel(baseLat + 4.5 * gridStepLat, baseLng + i * gridStepLng, w, h);
                    const ctrlVX = (pStartV.x + pEndV.x) / 2 + (vSpec ? vSpec.curve : (i % 2 === 0 ? 14 : -14));

                    ctx.strokeStyle = isMajorV ? '#f59e0b' : (isNight ? '#475569' : '#cbd5e1');
                    ctx.lineWidth = (isMajorV ? 11.5 : 7.5) * roadScale;
                    ctx.beginPath();
                    ctx.moveTo(pStartV.x, pStartV.y);
                    ctx.quadraticCurveTo(ctrlVX, (pStartV.y + pEndV.y) / 2, pEndV.x, pEndV.y);
                    ctx.stroke();

                    ctx.strokeStyle = isMajorV ? (isNight ? '#fef08a' : '#fffbeb') : (isNight ? '#64748b' : '#ffffff');
                    ctx.lineWidth = (isMajorV ? 7.2 : 4.5) * roadScale;
                    ctx.beginPath();
                    ctx.moveTo(pStartV.x, pStartV.y);
                    ctx.quadraticCurveTo(ctrlVX, (pStartV.y + pEndV.y) / 2, pEndV.x, pEndV.y);
                    ctx.stroke();

                    if (vSpec && Math.abs(i) <= 2) {
                        ctx.save();
                        ctx.font = 'bold 10px "Noto Sans KR", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.lineWidth = 3;
                        ctx.strokeStyle = isNight ? 'rgba(15,23,42,0.9)' : 'rgba(255,255,255,0.92)';
                        const labelY = Math.max(92, Math.min(h - 42, h * 0.22));
                        ctx.strokeText(vSpec.name, ctrlVX, labelY);
                        ctx.fillStyle = isNight ? '#f8fafc' : '#334155';
                        ctx.fillText(vSpec.name, ctrlVX, labelY);
                        ctx.restore();
                    }

                    const hSpec = roadNet.hRoads[Math.abs(i) % roadNet.hRoads.length];
                    const isMajorH = i === 0 || (hSpec && hSpec.major && Math.abs(i) % 2 === 0);
                    const pStartH = latLonToPixel(baseLat + i * gridStepLat, baseLng - 4.5 * gridStepLng, w, h);
                    const pEndH = latLonToPixel(baseLat + i * gridStepLat, baseLng + 4.5 * gridStepLng, w, h);
                    const ctrlHY = (pStartH.y + pEndH.y) / 2 + (hSpec ? hSpec.curve : (i % 2 === 0 ? -12 : 12));

                    ctx.strokeStyle = isMajorH ? '#f59e0b' : (isNight ? '#475569' : '#cbd5e1');
                    ctx.lineWidth = (isMajorH ? 11.5 : 7.5) * roadScale;
                    ctx.beginPath();
                    ctx.moveTo(pStartH.x, pStartH.y);
                    ctx.quadraticCurveTo((pStartH.x + pEndH.x) / 2, ctrlHY, pEndH.x, pEndH.y);
                    ctx.stroke();

                    ctx.strokeStyle = isMajorH ? (isNight ? '#fef08a' : '#fffbeb') : (isNight ? '#64748b' : '#ffffff');
                    ctx.lineWidth = (isMajorH ? 7.2 : 4.5) * roadScale;
                    ctx.beginPath();
                    ctx.moveTo(pStartH.x, pStartH.y);
                    ctx.quadraticCurveTo((pStartH.x + pEndH.x) / 2, ctrlHY, pEndH.x, pEndH.y);
                    ctx.stroke();

                    if (hSpec && Math.abs(i) <= 2) {
                        ctx.save();
                        ctx.font = 'bold 10px "Noto Sans KR", sans-serif';
                        ctx.textAlign = 'left';
                        ctx.lineWidth = 3;
                        ctx.strokeStyle = isNight ? 'rgba(15,23,42,0.9)' : 'rgba(255,255,255,0.92)';
                        ctx.strokeText(hSpec.name, 14, ctrlHY - 6);
                        ctx.fillStyle = isNight ? '#f8fafc' : '#334155';
                        ctx.fillText(hSpec.name, 14, ctrlHY - 6);
                        ctx.restore();
                    }
                }

                const hubCenter = latLonToPixel(baseLat, baseLng, w, h);
                ctx.save();
                ctx.beginPath();
                ctx.arc(hubCenter.x, hubCenter.y, 13 * roadScale, 0, Math.PI * 2);
                ctx.fillStyle = isNight ? '#1e293b' : '#ffffff';
                ctx.fill();
                ctx.lineWidth = 3 * roadScale;
                ctx.strokeStyle = '#f59e0b';
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(hubCenter.x, hubCenter.y, 5.5 * roadScale, 0, Math.PI * 2);
                ctx.fillStyle = '#dcfce7';
                ctx.fill();
                ctx.restore();

                const diagA = latLonToPixel(baseLat - 2.5 * gridStepLat, baseLng - 2.5 * gridStepLng, w, h);
                const diagB = latLonToPixel(baseLat + 2.5 * gridStepLat, baseLng + 2.5 * gridStepLng, w, h);
                ctx.strokeStyle = isNight ? '#475569' : '#cbd5e1';
                ctx.lineWidth = 8.5 * roadScale;
                ctx.beginPath(); ctx.moveTo(diagA.x, diagA.y); ctx.lineTo(diagB.x, diagB.y); ctx.stroke();
                ctx.strokeStyle = isNight ? '#64748b' : '#ffffff';
                ctx.lineWidth = 5 * roadScale;
                ctx.beginPath(); ctx.moveTo(diagA.x, diagA.y); ctx.lineTo(diagB.x, diagB.y); ctx.stroke();

                const diagMid = { x: (diagA.x + diagB.x) / 2, y: (diagA.y + diagB.y) / 2 };
                const angle = Math.atan2(diagB.y - diagA.y, diagB.x - diagA.x);
                ctx.save();
                ctx.translate(diagMid.x, diagMid.y);
                ctx.rotate(angle);
                ctx.fillStyle = isNight ? '#e2e8f0' : '#475569';
                ctx.font = 'bold 10px "Noto Sans KR", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(roadNet.diagRoadName, 0, -6);
                ctx.restore();

                (roadNet.landmarks || []).forEach(lm => {
                    const pt = latLonToPixel(baseLat + lm.dy * gridStepLat, baseLng + lm.dx * gridStepLng, w, h);
                    if (pt.x < -60 || pt.x > w + 60 || pt.y < 70 || pt.y > h - 40) return;

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y - 10, 10, 0, Math.PI * 2);
                    ctx.fillStyle = lm.tint;
                    ctx.fill();
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();

                    ctx.font = '11px "Noto Sans KR", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = lm.fg;
                    ctx.fillText(lm.icon, pt.x, pt.y - 9.5);

                    ctx.font = 'bold 10px "Noto Sans KR", sans-serif';
                    ctx.textBaseline = 'top';
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = isNight ? 'rgba(15,23,42,0.9)' : 'rgba(255,255,255,0.9)';
                    ctx.strokeText(lm.label, pt.x, pt.y + 3);
                    ctx.fillStyle = isNight ? '#f1f5f9' : '#334155';
                    ctx.fillText(lm.label, pt.x, pt.y + 3);
                    ctx.restore();
                });

                renderOverlays(w, h);
                renderStoreList();
            } catch (e) {
                safeShowToast('지도 렌더링 중 오류가 발생했습니다.');
            }
        }

        function renderOverlays(w, h) {
            const overlay = document.getElementById('mapOverlayLayer');
            if (!overlay) return;
            let html = '';

            const uPx = latLonToPixel(userLocation.lat, userLocation.lng, w, h);
            const edgePx = latLonToPixel(userLocation.lat + (CATCH_RANGE / 111320), userLocation.lng, w, h);
            const rangeRadius = Math.max(10, Math.abs(edgePx.y - uPx.y));
            html += `<div style="position:absolute; left:${uPx.x - rangeRadius}px; top:${uPx.y - rangeRadius}px; width:${rangeRadius * 2}px; height:${rangeRadius * 2}px; border:1.5px dashed rgba(37,99,235,0.45); background:rgba(59,130,246,0.06); border-radius:50%; pointer-events:none;"></div>`;

            if (activeDestination) {
                const dPx = latLonToPixel(activeDestination.lat, activeDestination.lng, w, h);
                const midPx = { x: dPx.x, y: uPx.y };
                html += `
                    <svg class="absolute inset-0 w-full h-full pointer-events-none" style="z-index:20;">
                        <polyline points="${uPx.x},${uPx.y} ${midPx.x},${midPx.y} ${dPx.x},${dPx.y}" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10,8"/>
                        <circle cx="${dPx.x}" cy="${dPx.y}" r="8" fill="#2563eb" opacity="0.25"/>
                    </svg>
                `;
            }

            const dispUser = userProfile.hasSetNickname && userProfile.name ? userProfile.name : '나';
            html += `
                <div style="position:absolute; left:${uPx.x}px; top:${uPx.y}px; transform:translate(-50%,-50%); z-index:60; pointer-events:none;">
                    <div class="w-10 h-10 bg-white border-2 border-blue-600 rounded-full shadow-lg flex items-center justify-center text-xl">
                        ${userProfile.emoji}
                    </div>
                    <div class="mt-0.5 px-1.5 py-0.2 bg-slate-900 text-white text-[9px] font-bold rounded text-center shadow">${dispUser}</div>
                </div>
            `;

            const filtered = getFilteredStores();
            const countEl = document.getElementById('storeCount');
            if (countEl) countEl.textContent = filtered.length;

            const placedBoxes = [{ x: uPx.x, y: uPx.y }];
            const minScreenDist = mapZoom < 13.5 ? 54 : 36;

            filtered.forEach(store => {
                const px = latLonToPixel(store.lat, store.lng, w, h);
                if (px.x < -50 || px.x > w + 50 || px.y < -50 || px.y > h + 50) return;

                const isOverlapping = placedBoxes.some(b => Math.hypot(b.x - px.x, b.y - px.y) < minScreenDist);
                if (isOverlapping && (!activeDestination || activeDestination.name !== store.name)) return;
                placedBoxes.push({ x: px.x, y: px.y });

                const cfg = BRAND_CONFIG[store.brand] || BRAND_CONFIG.CU;
                const mon = getStoreMonster(store.id);
                const savedMon = dex[mon.id];
                const displayName = (savedMon && savedMon.nickname) ? savedMon.nickname : mon.name;
                const safeStoreName = String(store.name || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");

                html += `
                    <div onclick="focusStore(${store.lat}, ${store.lng}, '${safeStoreName}')" style="position:absolute; left:${px.x}px; top:${px.y}px; transform:translate(-50%, -100%); z-index:45; cursor:pointer; pointer-events:auto;" class="group">
                        <div class="mon-bubble" onclick="event.stopPropagation(); openEncounter(${store.id})">
                            <div class="bg-white/95 backdrop-blur px-2 py-1 rounded-2xl shadow-md border border-slate-200 flex items-center gap-1.5 hover:scale-105 transition">
                                <span class="text-2xl leading-none">${getMonsterSVG(mon)}</span>
                                <span class="text-[10px] font-extrabold text-slate-800 whitespace-nowrap">${displayName}</span>
                            </div>
                        </div>
                        <div style="background-color:${cfg.color};" class="w-7 h-7 rounded-full rounded-br-none -rotate-45 shadow-md border-2 border-white flex items-center justify-center mx-auto">
                            <span class="rotate-45 text-[9px] font-black text-white">${cfg.short}</span>
                        </div>
                    </div>
                `;
            });

            overlay.innerHTML = html;
        }

        function zoomMap(delta) {

        function locateUserGPS(isInitial = false) {
            if (!navigator.geolocation) {

        /* ===== 7. 편의점 리스트 및 쿠폰 시스템 ===== */
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function getFilteredStores() {
            const input = document.getElementById('searchInput');
            const q = input ? input.value.trim().toLowerCase() : '';
            const secretCode = atob('MzAwMFrsm50=').toLowerCase();

            if (q === '쿠폰코드0011' && !cheatModeActive) {
                cheatModeActive = true;
                userProfile.gold += 3000;
                userProfile.bags.normal += 20;
                userProfile.bags.premium += 5;
                saveGameData();
                showToast('🎁 쿠폰코드 적용! 3,000G + 고급 봉투 & 거리제한 해제!');
            }

            return STORES_DATA.map(s => ({
                ...s,
                distance: calculateDistance(userLocation.lat, userLocation.lng, s.lat, s.lng)
            })).filter(s => {
                if (selectedBrand !== 'ALL' && s.brand !== selectedBrand) return false;
                const hasSearchQuery = Boolean(q && q !== '쿠폰코드0011' && q !== secretCode);
                if (!cheatModeActive && !hasSearchQuery && s.distance > currentRadius) return false;
                if (hasSearchQuery) {
                    const matchStore = s.name.toLowerCase().includes(q) || s.address.toLowerCase().includes(q);
                    const mon = getStoreMonster(s.id);
                    const matchMon = mon.name.toLowerCase().includes(q);
                    if (!matchStore && !matchMon) return false;
                }
                return true;
            }).sort((a, b) => a.distance - b.distance);
        }

        function useEquippedSlot1() {
            if (!enc) return;

                showToast('1번 1+1 상품이 없습니다. 상점에서 구매해 주세요.');
                return;
            }
            userProfile.items.onePlusOne--;
            enc.bonusExtraMon = (enc.bonusExtraMon || 0) + 1;
            saveGameData();
            renderEncounterModal();
            showToast('🎁 1+1 상품 적용! 이번 포획 성공 시 1마리를 추가로 받습니다.');

        function useEquippedSlot2() {
            if (!enc) return;
            if ((userProfile.items.hotWater || 0) <= 0) {
                showToast('2번 뜨거운 물이 없습니다. 상점에서 구매해 주세요.');

            userProfile.items.hotWater--;

            if (!enc) return;

            renderEncounterModal();
            showToast('🏷️ 30% 할인 아이템 사용! 2분 동안 포획 확률이 30% 높아집니다.');
        }

        function scanMonster() {
            if (!enc || enc.throwing) return;
            if (enc.hp <= 20) {
                showToast('이미 충분히 방심한 상태입니다! 봉투에 담아보세요.');
                return;
            }
            enc.hp = Math.max(20, enc.hp - 35);
            enc.rate = Math.min(95, enc.rate + 20);
            renderEncounterModal();
            showToast('삐빅! 바코드 스캔 성공! 포획 확률이 크게 올랐습니다.');
        }

        function throwBag(type) {
            if (!enc || enc.throwing) return;
            if (type !== 'tarpaulin') {
                if ((userProfile.bags[type] || 0) <= 0) {
                    showToast('해당 비닐봉투가 부족합니다! 우측 상점에서 구매하세요.');
                    return;
                }
                userProfile.bags[type]--;
            }
            enc.throwing = true;
            saveGameData();

            const activeEnc = enc;
            const mult = getHotWaterMultiplier(activeEnc.mon);
            const discBonus = getDiscount30Bonus();
            const bonus = type === 'tarpaulin' ? 40 : (type === 'premium' ? 45 : (type === 'eco' ? 20 : 0));
            const chance = Math.min(99, Math.round((activeEnc.rate + bonus) * mult) + discBonus);
            const sprite = document.getElementById('encSprite');
            if (sprite) {
                sprite.innerHTML = type === 'tarpaulin' ? '🧳✨' : (type === 'premium' ? '✨🛍️✨' : (type === 'eco' ? '♻️🛍️' : '🛍️'));
                sprite.classList.add('bag-shake');
            }

            setTimeout(() => {
                if (!enc || enc !== activeEnc) return;
                if (Math.random() * 100 <= chance) {
                    const m = activeEnc.mon;
                    const totalCaught = 1 + (activeEnc.bonusExtraMon || 0);
                    if (!dex[m.id]) {
                        dex[m.id] = { count: totalCaught, level: 1, nickname: '', aura: '#e0f2fe', color: m.color };
                    } else {
                        dex[m.id].count += totalCaught;
                        dex[m.id].level = Math.min(100, dex[m.id].level + 2 * totalCaught);
                    }
                    const rewardGold = 120 * totalCaught;
                    userProfile.gold += rewardGold;
                    delete spawns[activeEnc.store.id];
                    enc = null;
                    saveGameData();
                    closeModal();
                    showToast(totalCaught > 1
                        ? `🎉 1+1 적용! ${m.name} ${totalCaught}마리 획득! (+${rewardGold}G)`
                        : `🎉 ${m.name}을(를) 편의점 봉투에 안전하게 담았습니다! (+${rewardGold}G)`);
                    redrawMap();
                } else {
                    activeEnc.throwing = false;
                    activeEnc.rate = Math.min(99, activeEnc.rate + 8);
                    renderEncounterModal();
                    showToast('앗! 편의몬이 가방을 뚫고 튀어나왔습니다! (포획률 +8%)');
                }
            }, 300);
        }

            }
            if (friendsList.some(f => f.name === name)) {
                showToast('이미 등록된 친구입니다.');
                return;
            }

            const newFriend = {
                id: 'f_' + Date.now(),
                name: name,
                emoji: ['🦊', '🐼', '🦁', '🐯', '🐰'][Math.floor(Math.random() * 5)],
                dist: Math.floor(Math.random() * 400 + 50) + 'm',
                mon: '참치마요몽',
                status: 'friend'
            };
            friendsList.push(newFriend);
            saveGameData();
            input.value = '';
            openRadar();
            showToast(`🎉 '${name}' 님과 친구가 되었습니다!`);
        }

        function acceptFriend(id) {
            const idx = pendingRequests.findIndex(p => p.id === id);
            if (idx !== -1) {
                const req = pendingRequests.splice(idx, 1)[0];
                req.status = 'friend';
                friendsList.push(req);
                saveGameData();
                openRadar();
                showToast(`🤝 '${req.name}' 님의 친구 요청을 수락했습니다!`);
            }
        }

        function rejectFriend(id) {
            const idx = pendingRequests.findIndex(p => p.id === id);
            if (idx !== -1) {
                pendingRequests.splice(idx, 1);
                saveGameData();
                openRadar();
                showToast('친구 요청을 거절했습니다.');
            }
        }

        function sendGiftToFriend(name) {
            userProfile.gold += 50;
            userProfile.bags.normal += 2;
            saveGameData();
            showToast(`🎁 '${name}' 님에게 봉투와 선물을 보내 50G & 일반봉투 2개를 획득했습니다!`);
        }

        /* ===== 12. 유틸리티 모달 & 토스트 ===== */
        function showModal(html, modalType = null) {
            currentModalType = modalType;
            const el = document.getElementById('gameModal');
            el.innerHTML = html;
            el.classList.remove('hidden');
            el.classList.add('flex');
        }

        function closeModal() {
            currentModalType = null;
            const el = document.getElementById('gameModal');
            el.classList.add('hidden');
            el.classList.remove('flex');
        }

        let toastTimer = null;
        function showToast(msg) {
            const el = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            el.style.opacity = '1';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 2600);
        }
    </script>
</body>
</html>
